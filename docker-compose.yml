# ClientFlow CRM - local/demo stack: PostgreSQL + Django (gunicorn) + React (nginx)
#   cp .env.example .env   # then set DJANGO_SECRET_KEY and POSTGRES_PASSWORD
#   docker compose up --build
#   open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clientflow}
      POSTGRES_USER: ${POSTGRES_USER:-clientflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      # This stack serves plain HTTP on localhost. Put a TLS-terminating proxy in front for real deployments
      # and remove this override so HTTPS redirect + HSTS are enforced.
      DJANGO_SECURE_SSL_REDIRECT: "false"
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      POSTGRES_DB: ${POSTGRES_DB:-clientflow}
      POSTGRES_USER: ${POSTGRES_USER:-clientflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      DEMO_PASSWORD: ${DEMO_PASSWORD:-ClientFlow-Demo-2026}
      SEED_DEMO: ${SEED_DEMO:-true}

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
